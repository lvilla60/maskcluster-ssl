# Bounded technical verification; these are not experimental hyperparameters.
seed: 31415
output_dir: outputs/smoke
data:
  training: Input/raw/training.h5
  validation: Input/raw/validation.h5
runtime:
  device: cpu
  num_workers: 0
  amp: false
  torch_threads: 2
smoke:
  variants: [baseline, no_mim, full]
  steps_per_variant: 1
  validation_queries: 4
  validation_gallery: 24
model:
  image_size: [64, 32]
  local_size: [32, 16]
  local_crops: 1
  patch_size: 8
  embed_dim: 32
  depth: 2
  num_heads: 4
  mlp_ratio: 2.0
  prototypes: 16
  mask_ratio: 0.5
  reconstruction_layers: [1, 2]
  attention_mode: visible
  photometric:
    photometric: true
    brightness: 0.15
    contrast: 0.15
    saturation: 0.10
    grayscale_probability: 0.05
planned_backbone:
  image_size: [128, 64]
  local_size: [96, 48]
  local_crops: 1
  patch_size: 16
  embed_dim: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  prototypes: 1024
  mask_ratio: 0.5
  reconstruction_layers: [6, 8, 10, 12]
  attention_mode: visible
loss:
  student_temperature: 0.1
  teacher_temperature: 0.04
  me_max_temperature: 0.1
  weights:
    global_clustering: 1.0
    patch_clustering: 1.0
    reconstruction: 1.0
    global_me_max: 1.0
    patch_me_max: 1.0
training:
  batch_size: 2
  learning_rate: 0.0001
  minimum_learning_rate: 0.000001
  weight_decay: 0.05
  warmup_epochs: 0
  gradient_clip: 3.0
  ema_momentum: 0.9
  ema_momentum_final: 0.9
evaluation:
  batch_size: 8
  query_block_size: 2
